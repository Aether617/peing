<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5aa83c">
<title>Gece Köyü</title>
<style>
:root{
  --grass:#6fb544; --grass2:#5aa23a; --sand:#e8cf8f; --ink:#2b2a33; --paper:#fffaf0;
  --red:#d9473f; --green:#3fae52; --night:#102a3d; --gold:#f2b63a; --blue:#3b7bd4;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d3a24;color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.screen{position:absolute;inset:0;overflow:hidden}

/* ---------- Ana ekran ---------- */
#home{background:linear-gradient(#7cc653,#4f9a35);display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--paper);border-radius:22px;padding:22px;width:100%;max-width:420px;
  box-shadow:0 6px 0 rgba(0,0,0,.18)}
.logo{font-size:34px;font-weight:900;text-align:center;margin:0 0 4px;letter-spacing:.5px}
.sub{text-align:center;margin:0 0 18px;opacity:.7}
.card input{width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:3px solid #d8c9a5;
  background:#fff;margin-bottom:10px;outline:none}
.card input:focus{border-color:var(--blue)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:18px;font-weight:800;
  background:var(--green);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22);margin-bottom:12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.blue{background:var(--blue)} .btn.red{background:var(--red)} .btn.grey{background:#8d8a96}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:15px;margin:0}
.row{display:flex;gap:8px}
.row input{margin:0}
.row .btn{width:auto;margin:0;white-space:nowrap}
.hint{font-size:13px;opacity:.65;text-align:center;margin:8px 0 0}

/* ---------- Lobi ---------- */
#lobby{background:linear-gradient(#7cc653,#4f9a35);overflow-y:auto;padding:calc(14px + var(--safe-t)) 14px calc(14px + var(--safe-b))}
.lobbywrap{max-width:560px;margin:0 auto}
.codebox{text-align:center;background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.18);margin-bottom:12px}
.code{font-size:46px;font-weight:900;letter-spacing:10px;margin:0 0 0 10px}
.panel{background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 5px 0 rgba(0,0,0,.18);margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:18px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px 5px 6px;border:2px solid #e3d6b5;font-weight:700}
.dot{width:20px;height:20px;border-radius:50%;background:var(--c);border:2px solid rgba(0,0,0,.25)}
.rolerow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;margin-bottom:6px;color:#fff}
.rolerow.masum{background:#4aa35a}.rolerow.hain{background:#d1544c}.rolerow.tarafsiz{background:#8c6bc4}
.rolerow .ic{font-size:26px;width:36px;text-align:center}
.rolerow .nm{flex:1;font-weight:800;line-height:1.15}
.rolerow .nm small{display:block;font-weight:500;opacity:.9;font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:rgba(255,255,255,.9);font-size:20px;font-weight:900;color:var(--ink)}
.stepper b{min-width:20px;text-align:center;font-size:18px}

/* ---------- Oyun ---------- */
#game{background:var(--grass)}
#world{position:absolute;inset:0;background:
  radial-gradient(ellipse 52% 40% at 50% 48%, var(--sand) 0 62%, transparent 63%),
  radial-gradient(circle at 12% 18%, #5fa93b 0 7%, transparent 8%),
  radial-gradient(circle at 88% 82%, #5fa93b 0 9%, transparent 10%),
  linear-gradient(var(--grass),var(--grass2));
  transition:filter 1s}
#pond{position:absolute;left:3%;top:20%;width:22%;height:10%;border-radius:50%;background:#58b6e8;border:3px solid #3f93c4;opacity:.9}
#tree1,#tree2{position:absolute;font-size:34px}
#tree1{left:78%;top:12%}#tree2{left:6%;top:76%}
#shade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:900}
#game.night #shade{opacity:.68}
.house{position:absolute;width:clamp(50px,12vmin,86px);transform:translate(-50%,-62%);text-align:center;
  transition:filter .3s;cursor:default}
.house svg{display:block;width:100%;height:auto;overflow:visible}
.house .win{fill:#a6dcff;transition:fill 1s}
#game.night .house .win{fill:#ffd45e}
.house .hname{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:12px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
#game.night .house .hname{opacity:1;z-index:1000}
.house.canpick{cursor:pointer;filter:drop-shadow(0 0 6px #6dff7c) drop-shadow(0 0 2px #6dff7c)}
#game.night .house.canpick{animation:pulse 1.3s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 12px #6dff7c) drop-shadow(0 0 4px #6dff7c)}}
.house.sel{filter:drop-shadow(0 0 8px #ff5b4f) drop-shadow(0 0 3px #ff5b4f)!important;animation:none!important}
.house .badge{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);min-width:26px;height:26px;border-radius:13px;
  background:#fff;border:3px solid var(--red);font-weight:900;font-size:15px;line-height:20px;color:var(--red);display:none}
.house .badge.on{display:block}
.pawn{position:absolute;width:30px;transform:translate(-50%,-92%);text-align:center;
  transition:left 1.4s ease-in-out,top 1.4s ease-in-out,opacity .6s}
.pawn .body{position:relative;width:26px;height:34px;margin:0 auto;background:var(--c);border-radius:13px 13px 8px 8px;
  border:2px solid rgba(0,0,0,.45);box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.pawn .body::before{content:"";position:absolute;left:5px;top:10px;width:4px;height:5px;border-radius:50%;background:#222;
  box-shadow:10px 0 0 #222}
.pawn .body::after{content:"";position:absolute;left:8px;top:-6px;width:8px;height:7px;border-radius:50% 50% 0 0;background:var(--c);
  border:2px solid rgba(0,0,0,.45);border-bottom:0}
.pawn .pname{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:12px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;margin-top:2px}
.pawn.me .pname{color:#ffe56b}
.pawn.hide{opacity:0;pointer-events:none}
.pawn.ghost{opacity:.5;filter:grayscale(1)}
.pawn.ghost .body{border-style:dashed}
#game.night .pawn .pname{display:none}
#game.night .pawn.ghost .pname{display:block}
.pawn.canvote{cursor:pointer}

#top{position:absolute;left:0;right:0;top:0;padding:calc(6px + var(--safe-t)) 8px 6px;display:flex;align-items:center;gap:6px;z-index:1000;
  pointer-events:none}
#strip{display:flex;gap:3px;flex-wrap:wrap;flex:1;pointer-events:auto}
.tile{width:26px;height:26px;border-radius:7px;background:#f4efe1;border:2px solid #cdbf9a;text-align:center;font-size:15px;line-height:22px;font-weight:900}
.tile.rev{background:#fff}
#timer{pointer-events:auto;background:rgba(255,250,240,.95);border-radius:12px;padding:4px 12px;font-weight:900;font-size:20px;
  display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
#timer.low{color:var(--red)}
#exit{pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,250,240,.95);font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}

#bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(10px + var(--safe-b));z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#bottom>*{pointer-events:auto}
#prompt{background:rgba(255,250,240,.96);border-radius:16px;padding:9px 14px;font-weight:700;text-align:center;max-width:520px;box-shadow:0 4px 0 rgba(0,0,0,.2);font-size:15px}
#prompt small{display:block;font-weight:500;opacity:.7}
#actions{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.pill{border:0;border-radius:14px;padding:10px 16px;font-weight:800;font-size:16px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.22);position:relative}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.pill.role{display:flex;align-items:center;gap:6px;background:#fffaf0}
.pill.skip{background:#fff}
.pill.skip.on{background:#ffe0dd;outline:3px solid var(--red)}
.pill .cnt{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;line-height:22px;padding:0 4px}

#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);background:#fffaf0;border-radius:22px;padding:22px 30px;
  font-size:24px;font-weight:900;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);z-index:1500;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;max-width:88%}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-size:15px;font-weight:600;margin-top:6px;opacity:.75}

.drawer{position:absolute;left:0;right:0;bottom:0;height:52%;background:rgba(255,250,240,.98);border-radius:22px 22px 0 0;z-index:1400;
  display:flex;flex-direction:column;padding:12px 12px calc(12px + var(--safe-b));box-shadow:0 -4px 0 rgba(0,0,0,.2);transform:translateY(105%);transition:transform .25s}
.drawer.on{transform:none}
.drawer h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.drawer h4 button{border:0;background:#e9e1cb;border-radius:10px;width:32px;height:32px;font-weight:900}
.msgs{flex:1;overflow-y:auto;font-size:15px}
.msg{margin:0 0 6px}.msg b{color:var(--c)}
.msg.sys{font-style:italic;opacity:.8}
.note{padding:7px 10px;border-radius:12px;background:#fff;margin-bottom:6px;border-left:6px solid #d8c9a5;font-size:15px}
.note.priv{border-left-color:var(--blue);background:#eef5ff}
.note.death{border-left-color:var(--red)}
.chatin{display:flex;gap:8px;margin-top:8px}
.chatin input{flex:1;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:3px solid #d8c9a5;outline:none}
.chatin button{border:0;background:var(--blue);color:#fff;font-weight:800;border-radius:12px;padding:0 16px}

#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
#modal .card{text-align:center}
#modal .big{font-size:56px;margin:0}
.team{display:inline-block;padding:3px 12px;border-radius:999px;color:#fff;font-weight:800;font-size:14px}
.team.masum{background:#4aa35a}.team.hain{background:#d1544c}.team.tarafsiz{background:#8c6bc4}
.final{max-height:38vh;overflow-y:auto;text-align:left;margin:10px 0}
.final div{padding:4px 2px;border-bottom:1px solid #e3d6b5}

#toast{position:fixed;left:50%;top:calc(60px + var(--safe-t));transform:translateX(-50%);background:#2b2a33;color:#fff;padding:10px 16px;
  border-radius:12px;z-index:3000;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- Ana ekran -->
<div id="home" class="screen">
  <div class="card">
    <h1 class="logo">🌙 Gece Köyü</h1>
    <p class="sub">Gece rolünü kullan, sabah köyden birini at.</p>
    <input id="nameIn" maxlength="12" placeholder="Adın" autocomplete="off">
    <button class="btn" id="createBtn">Oda kur</button>
    <div class="row">
      <input id="codeIn" maxlength="4" placeholder="Oda kodu" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase">
      <button class="btn blue" id="joinBtn">Katıl</button>
    </div>
    <p class="hint">Arkadaşların aynı kodu girerek odana katılır. 3–12 oyuncu.</p>
  </div>
</div>

<!-- Lobi -->
<div id="lobby" class="screen hidden"><div class="lobbywrap" id="lobbyBody"></div></div>

<!-- Oyun -->
<div id="game" class="screen hidden">
  <div id="world">
    <div id="pond"></div><div id="tree1">🌳</div><div id="tree2">🌲</div>
  </div>
  <div id="shade"></div>
  <div id="top">
    <div id="strip"></div>
    <div id="timer"><span id="phIco">☀️</span><span id="secs">0</span></div>
    <button id="exit" title="Çık">✕</button>
  </div>
  <div id="bottom">
    <div id="prompt"></div>
    <div id="actions"></div>
  </div>
  <div id="banner"></div>

  <div class="drawer" id="chatDr">
    <h4>💬 Sohbet <button data-close="chatDr">✕</button></h4>
    <div class="msgs" id="msgs"></div>
    <div class="chatin"><input id="chatIn" maxlength="140" placeholder="Bir şey yaz…" autocomplete="off"><button id="chatSend">Gönder</button></div>
  </div>
  <div class="drawer" id="noteDr">
    <h4>📓 Defter <button data-close="noteDr">✕</button></h4>
    <div class="msgs" id="notes"></div>
  </div>
  <div id="modal" class="hidden"></div>
</div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
"use strict";
/* ===================== Firebase ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyDGp2eIej9hNovLFW9hypgx8Qz_8FOgeBw",
  authDomain: "peing-9b914.firebaseapp.com",
  databaseURL: "https://peing-9b914-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "peing-9b914",
  storageBucket: "peing-9b914.firebasestorage.app",
  messagingSenderId: "175739015058",
  appId: "1:175739015058:web:4324006e1f69750c86bb4b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let offset = 0;
db.ref(".info/serverTimeOffset").on("value", s => offset = s.val() || 0);
const now = () => Date.now() + offset;

/* ===================== Yardımcılar ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let toastT;
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2400); }

const COLORS = ["#e0443e","#3b7bd4","#f2c230","#3fae52","#9b59d0","#f08a24","#ec6fa8","#2cc5c5","#8a5a3c","#b6e03a","#7f8c9a","#ffffff"];
const BOTNAMES = ["Pamuk","Fındık","Zeytin","Badem","Çilek","Limon","Kestane","Nane","Tarçın","Ceviz","Karamel"];

const ROLES = {
  koylu:     {n:"Köylü",      e:"🏠", team:"masum",    act:false, d:"Özel yeteneğin yok. Dikkatle dinle, doğru kişiyi oyla."},
  doktor:    {n:"Doktor",     e:"🩺", team:"masum",    act:true,  q:"Kimi koruyacaksın?", d:"Her gece bir evi koru. O gece saldırıya uğrarsa ölmez. Kendini de koruyabilirsin."},
  polis:     {n:"Polis",      e:"🚓", team:"masum",    act:true,  q:"Kimi sorgulayacaksın?", d:"Her gece birini sorgula. Sabah Hain gibi mi yoksa masum mu göründüğünü öğrenirsin."},
  izci:      {n:"İzci",       e:"👣", team:"masum",    act:true,  q:"Kimi takip edeceksin?", d:"Her gece birini takip et. O gece hangi eve gittiğini öğrenirsin."},
  kamera:    {n:"Kameraman",  e:"📷", team:"masum",    act:true,  q:"Hangi eve kamera kuracaksın?", d:"Her gece bir eve kamera kur. O eve kaç kişinin geldiğini öğrenirsin."},
  deli:      {n:"Deli",       e:"🤪", team:"masum",    act:true,  q:"", d:"Masumsun ama kendini başka bir rol sanırsın. Aldığın bilgiler yanlıştır."},
  hain:      {n:"Hain",       e:"🔪", team:"hain",     act:true,  q:"Kimi öldüreceksin?", d:"Her gece bir kişiyi öldür. Diğer hainlerle aynı kişiyi seçerseniz o kişi ölür."},
  temizlikci:{n:"Temizlikçi", e:"🧹", team:"hain",     act:true,  q:"Kimi öldürüp temizleyeceksin?", d:"Hainlerle birlikte öldürürsün. Hedefin ölürse rolü kimseye açıklanmaz."},
  suclayici: {n:"Suçlayıcı",  e:"🪣", team:"hain",     act:true,  q:"Kimi suçlayacaksın?", d:"Bir kişiyi suçla. O gece Polis ona bakınca Hain görür. Sadece 3 kez kullanabilirsin."},
  seri:      {n:"Seri Katil", e:"🗡️", team:"tarafsiz", act:true,  q:"Kimi öldüreceksin?", d:"Tek başına oynarsın ve her gece birini öldürürsün. Son hayatta kalan sen olmaya çalış."}
};
const TEAMS = {masum:"Masum", hain:"Hain", tarafsiz:"Tarafsız"};
const ROLE_ORDER = ["koylu","doktor","polis","izci","kamera","deli","hain","temizlikci","suclayici","seri"];

/* ===================== Durum ===================== */
let pid = LS.get("gk_pid");
if (!pid) { pid = Math.random().toString(36).slice(2, 10); LS.set("gk_pid", pid); }
let code = null, R = null, roomRef = null;
let tickTimer = null, clockTimer = null;
let lastBannerKey = "", botKeyDone = "", doneKey = "";
const houses = {}, pawns = {};

/* ===================== Ekran geçişleri ===================== */
function show(id){ ["home","lobby","game"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }

/* ===================== Oda işlemleri ===================== */
function genCode(){ const L = "ABCDEFGHJKLMNPRSTUVYZ"; let c = ""; for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)]; return c; }
function myName(){ const n = $("nameIn").value.trim(); if (n) LS.set("gk_name", n); return n; }

async function createRoom(){
  const name = myName(); if (!name) return toast("Önce adını yaz");
  let c;
  for (let i = 0; i < 8; i++) {
    c = genCode();
    const s = await db.ref("rooms/" + c + "/state").once("value");
    if (!s.exists()) break;
  }
  await db.ref("rooms/" + c).set({
    host: pid, createdAt: now(),
    state: {phase:"lobby", day:0},
    settings: {roles:{hain:1, doktor:1, polis:1}, night:30, disc:75, vote:30},
    players: {[pid]: {name, color: COLORS[0], alive:true, at: now()}}
  });
  enter(c);
}

async function joinRoom(c){
  const name = myName(); if (!name) return toast("Önce adını yaz");
  c = (c || "").toUpperCase().trim();
  if (c.length !== 4) return toast("Oda kodu 4 harf olmalı");
  const s = await db.ref("rooms/" + c).once("value");
  const r = s.val();
  if (!r) return toast("Böyle bir oda yok");
  const pls = r.players || {};
  if (!pls[pid]) {
    if (r.state.phase !== "lobby") return toast("Oyun başlamış, katılamazsın");
    if (Object.keys(pls).length >= 12) return toast("Oda dolu (en fazla 12)");
    const used = Object.values(pls).map(p => p.color);
    const color = COLORS.find(x => !used.includes(x)) || COLORS[0];
    await db.ref("rooms/" + c + "/players/" + pid).set({name, color, alive:true, at: now()});
  }
  enter(c);
}

function enter(c){
  code = c; LS.set("gk_room", c);
  if (roomRef) roomRef.off();
  roomRef = db.ref("rooms/" + c);
  roomRef.on("value", onSnap);
  clearInterval(tickTimer); tickTimer = setInterval(hostTick, 700);
  clearInterval(clockTimer); clockTimer = setInterval(updateClock, 250);
}

function leave(){
  if (roomRef) roomRef.off(); roomRef = null;
  clearInterval(tickTimer); clearInterval(clockTimer);
  LS.del("gk_room"); code = null; R = null;
  Object.keys(houses).forEach(k => { houses[k].el.remove(); delete houses[k]; });
  Object.keys(pawns).forEach(k => { pawns[k].el.remove(); delete pawns[k]; });
  lastBannerKey = ""; botKeyDone = ""; doneKey = "";
  show("home");
}

function onSnap(s){
  const v = s.val();
  if (!v) { toast("Oda kapandı"); leave(); return; }
  if (!v.players || !v.players[pid]) { toast("Odadan çıkarıldın"); leave(); return; }
  R = v; render();
}

const isHost = () => R && R.host === pid;
const orderIds = () => Object.keys(R.players).sort((a, b) => R.players[a].at - R.players[b].at || (a < b ? -1 : 1));
const mySec = () => (R.secret && R.secret[pid]) || null;
const roleOf = id => (R.secret && R.secret[id] && R.secret[id].role) || "koylu";
const shownRole = () => { const s = mySec(); if (!s) return null; return s.role === "deli" ? s.fake : s.role; };
const isHainTeam = r => ROLES[r] && ROLES[r].team === "hain";

/* ===================== Render ===================== */
function render(){
  if (!R) { show("home"); return; }
  if (R.state.phase === "lobby") { show("lobby"); renderLobby(); closeDrawers(); $("modal").classList.add("hidden"); }
  else { show("game"); renderGame(); }
}

function renderLobby(){
  const ids = orderIds(), host = isHost(), roles = R.settings.roles || {};
  const total = ROLE_ORDER.reduce((a, k) => a + (roles[k] || 0), 0);
  let h = `<div class="codebox"><div style="opacity:.7">Oda kodu</div><div class="code">${esc(code)}</div>
    <button class="btn small blue" id="shareBtn">Kodu paylaş</button></div>`;
  h += `<div class="panel"><h3>Oyuncular (${ids.length}/12)</h3><div class="plist">` +
    ids.map(id => { const p = R.players[id]; return `<div class="chip"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}${id === R.host ? " 👑" : ""}${p.bot ? " 🤖" : ""}</div>`; }).join("") +
    `</div>`;
  if (host) h += `<div style="margin-top:10px"><button class="btn small grey" id="botBtn">+ Bot ekle</button> <button class="btn small grey" id="rmBotBtn">Botları sil</button></div>`;
  h += `</div>`;
  h += `<div class="panel"><h3>Roller ${host ? "" : "(oda sahibi ayarlar)"}</h3>`;
  ROLE_ORDER.forEach(k => {
    const r = ROLES[k], n = roles[k] || 0;
    if (k === "koylu") return;
    h += `<div class="rolerow ${r.team}"><div class="ic">${r.e}</div><div class="nm">${r.n}<small>${esc(r.d)}</small></div>` +
      (host ? `<div class="stepper"><button data-role="${k}" data-d="-1">−</button><b>${n}</b><button data-role="${k}" data-d="1">+</button></div>` : `<b style="font-size:20px">${n}</b>`) + `</div>`;
  });
  const fill = Math.max(0, ids.length - total);
  h += `<p class="hint">Kalan ${fill} oyuncu Köylü olur. Toplam rol: ${total}/${ids.length}</p>`;
  if (host) h += `<button class="btn grey small" id="autoBtn">Otomatik ayarla</button>`;
  h += `</div>`;
  h += host ? `<button class="btn" id="startBtn">Oyunu başlat</button>` : `<p class="hint" style="color:#fff">Oda sahibinin başlatması bekleniyor…</p>`;
  h += `<button class="btn grey" id="leaveBtn">Odadan çık</button>`;
  $("lobbyBody").innerHTML = h;

  $("shareBtn").onclick = async () => {
    const text = `Gece Köyü'nde oda kodum: ${code}`;
    try { if (navigator.share) { await navigator.share({text}); return; } } catch(e){}
    try { await navigator.clipboard.writeText(code); toast("Kod kopyalandı"); } catch(e){ toast("Kod: " + code); }
  };
  $("leaveBtn").onclick = leaveRoom;
  if (host) {
    $("startBtn").onclick = startGame;
    $("autoBtn").onclick = autoRoles;
    $("botBtn").onclick = addBot;
    $("rmBotBtn").onclick = removeBots;
    $("lobbyBody").querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
      const k = b.dataset.role, d = +b.dataset.d, v = Math.max(0, Math.min(6, (roles[k] || 0) + d));
      db.ref(`rooms/${code}/settings/roles/${k}`).set(v);
    });
  }
}

function leaveRoom(){
  if (R && R.state.phase === "lobby") {
    if (isHost()) db.ref("rooms/" + code).remove();
    else db.ref(`rooms/${code}/players/${pid}`).remove();
  }
  leave();
}

function autoRoles(){
  const n = Object.keys(R.players).length, r = {};
  r.hain = Math.max(1, Math.floor(n / 4));
  if (n >= 4) { r.doktor = 1; r.polis = 1; }
  if (n >= 6) r.izci = 1;
  if (n >= 7) r.deli = 1;
  if (n >= 8) r.kamera = 1;
  if (n >= 9) r.temizlikci = 1;
  if (n >= 10) r.seri = 1;
  if (n >= 11) r.suclayici = 1;
  db.ref(`rooms/${code}/settings/roles`).set(r);
}

function addBot(){
  const ids = orderIds();
  if (ids.length >= 12) return toast("Oda dolu");
  const used = Object.values(R.players).map(p => p.color), names = Object.values(R.players).map(p => p.name);
  const color = COLORS.find(c => !used.includes(c)) || COLORS[1];
  const name = BOTNAMES.find(b => !names.includes(b)) || "Bot" + ids.length;
  const id = "bot" + Math.random().toString(36).slice(2, 7);
  db.ref(`rooms/${code}/players/${id}`).set({name, color, alive:true, bot:true, at: now()});
}
function removeBots(){
  const u = {};
  Object.keys(R.players).forEach(id => { if (R.players[id].bot) u[`rooms/${code}/players/${id}`] = null; });
  db.ref().update(u);
}

/* ---------- Oyun ekranı ---------- */
function ringPos(i, n, rx, ry, cx = 50, cy = 46){
  const a = -Math.PI / 2 + i * 2 * Math.PI / n;
  return {x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a)};
}
const HOUSE_SVG = `<svg viewBox="0 0 72 64"><polygon points="4,30 36,4 68,30" fill="#8b5a3c" stroke="#5e3a25" stroke-width="2"/>
<rect x="11" y="29" width="50" height="31" rx="2" fill="#f0d9b5" stroke="#b79b6d" stroke-width="2"/>
<rect x="41" y="37" width="12" height="23" rx="6" fill="#7a4b2f"/><rect class="win" x="17" y="37" width="14" height="12" rx="2" stroke="#6b8aa5" stroke-width="1.5"/></svg>`;

function mkHouse(id){
  const el = document.createElement("div"); el.className = "house";
  el.innerHTML = HOUSE_SVG + `<div class="badge"></div><div class="hname"></div>`;
  el.onclick = () => onPick(id);
  $("world").appendChild(el);
  return {el, badge: el.querySelector(".badge"), name: el.querySelector(".hname")};
}
function mkPawn(id){
  const el = document.createElement("div"); el.className = "pawn";
  el.innerHTML = `<div class="body"></div><div class="pname"></div>`;
  el.onclick = () => onPick(id);
  $("world").appendChild(el);
  return {el, name: el.querySelector(".pname")};
}

function canPick(id){
  const st = R.state, me = R.players[pid];
  if (!me.alive || !R.players[id].alive) return false;
  if (st.phase === "night") {
    const r = roleOf(pid);
    if (!ROLES[r].act) return false;
    if (id === pid && r !== "doktor" && !(r === "deli" && mySec().fake === "doktor")) return false;
    if ((r === "hain" || r === "temizlikci") && isHainTeam(roleOf(id))) return false;
    if (r === "suclayici" && id === pid) return false;
    return true;
  }
  if (st.phase === "vote") return id !== pid;
  return false;
}
function selectedTarget(){
  const st = R.state;
  if (st.phase === "night") return R.actions && R.actions[pid] ? R.actions[pid].t : null;
  if (st.phase === "vote") return R.votes ? R.votes[pid] : null;
  return null;
}
function voteCounts(){
  const c = {}; let skip = 0;
  if (R.state.phase !== "vote" || !R.votes) return {c, skip};
  Object.keys(R.votes).forEach(v => {
    if (!R.players[v] || !R.players[v].alive) return;
    const t = R.votes[v];
    if (t === "skip") skip++; else if (R.players[t] && R.players[t].alive) c[t] = (c[t] || 0) + 1;
  });
  return {c, skip};
}

function renderGame(){
  const st = R.state, ph = st.phase, ids = orderIds(), n = ids.length;
  const g = $("game");
  g.classList.toggle("night", ph === "night");

  const sel = selectedTarget(), vc = voteCounts();
  ids.forEach((id, i) => {
    const p = R.players[id];
    if (!houses[id]) houses[id] = mkHouse(id);
    if (!pawns[id]) pawns[id] = mkPawn(id);
    const hp = ringPos(i, n, 37, 33), pp = ringPos(i, n, 17, 10.5, 50, 48);
    const H = houses[id], P = pawns[id];
    H.el.style.left = hp.x + "%"; H.el.style.top = hp.y + "%"; H.el.style.zIndex = Math.round(hp.y * 10);
    H.name.textContent = (p.alive ? "" : "☠ ") + p.name;
    const pick = canPick(id);
    H.el.classList.toggle("canpick", pick);
    H.el.classList.toggle("sel", sel === id);
    const cnt = vc.c[id] || 0;
    H.badge.textContent = cnt; H.badge.classList.toggle("on", ph === "vote" && cnt > 0);

    P.el.style.setProperty("--c", p.color);
    P.name.textContent = p.name + (id === pid ? " (sen)" : "");
    P.el.classList.toggle("me", id === pid);
    P.el.classList.toggle("canvote", pick);
    let x, y, cls = "";
    if (!p.alive) { x = hp.x + 6; y = hp.y + 4; cls = "ghost"; }
    else if (ph === "night") { x = hp.x; y = hp.y + 3; cls = "hide"; }
    else { x = pp.x; y = pp.y; }
    P.el.style.left = x + "%"; P.el.style.top = y + "%";
    P.el.style.zIndex = Math.round(y * 10) + 5;
    P.el.classList.toggle("ghost", cls === "ghost");
    P.el.classList.toggle("hide", cls === "hide");
  });
  Object.keys(houses).forEach(id => { if (!R.players[id]) { houses[id].el.remove(); delete houses[id]; pawns[id].el.remove(); delete pawns[id]; } });

  renderStrip(ids); renderBottom(); renderBanner(); renderDrawers(); renderOver();
  updateClock();
}

function renderStrip(ids){
  const rev = [], hid = [];
  ids.forEach(id => { const p = R.players[id]; if (!p.alive && p.rev && ROLES[p.rev]) rev.push(ROLES[p.rev].e); else hid.push("?"); });
  $("strip").innerHTML = rev.map(e => `<div class="tile rev">${e}</div>`).join("") + hid.map(() => `<div class="tile">?</div>`).join("");
}

function renderBottom(){
  const st = R.state, ph = st.phase, me = R.players[pid], alive = me.alive;
  const sr = shownRole(), r = sr ? ROLES[sr] : null, real = ROLES[roleOf(pid)];
  let prompt = "", acts = "";
  if (r) acts += `<button class="pill role" id="roleBtn">${r.e} ${r.n}</button>`;
  if (!alive) prompt = "👻 Öldün. Oyunu izleyebilirsin.";
  else if (ph === "night") {
    const sec = mySec(); let q = real.q;
    if (roleOf(pid) === "deli") q = ROLES[sec.fake].q;
    const t = selectedTarget();
    if (!real.act) prompt = "Bu gece yapacak bir şeyin yok. Uyu.";
    else prompt = q + (t === "-" ? "<small>Bu gece pas geçtin.</small>" : t ? `<small>Seçtin: ${esc(R.players[t].name)}</small>` : "<small>Yeşil yanan evlerden birine dokun.</small>");
    if (isHainTeam(roleOf(pid))) {
      const mates = Object.keys(R.players).filter(id => id !== pid && isHainTeam(roleOf(id))).map(id => R.players[id].name);
      prompt += `<small>Takım arkadaşların: ${mates.length ? esc(mates.join(", ")) : "yok"}</small>`;
    }
    if (roleOf(pid) === "suclayici") prompt += `<small>Kalan hakkın: ${mySec().uses || 0}</small>`;
    acts += `<button class="pill" id="sleepBtn">${t ? "Değiştir / Pas" : (real.act ? "Pas geç" : "Uyu")}</button>`;
  }
  else if (ph === "day") {
    prompt = "Tartışma zamanı: kim şüpheli?";
    if (isHost()) acts += `<button class="pill" id="voteNowBtn">Oylamaya geç</button>`;
  }
  else if (ph === "vote") {
    prompt = "Sürgün için bir eve dokun. Kimseyi istemiyorsan Atla.";
    const vc = voteCounts(), mine = selectedTarget();
    acts += `<button class="pill skip ${mine === "skip" ? "on" : ""}" id="skipBtn">Atla<span class="cnt">${vc.skip}</span></button>`;
  }
  else if (ph === "dawn") prompt = "Sabah oldu…";
  else if (ph === "vres") prompt = "Oylama sonucu";
  acts += `<button class="pill" id="chatBtn">💬</button><button class="pill" id="noteBtn">📓</button>`;
  $("prompt").innerHTML = prompt; $("prompt").style.display = prompt ? "" : "none";
  $("actions").innerHTML = acts;
  if ($("roleBtn")) $("roleBtn").onclick = showRole;
  if ($("sleepBtn")) $("sleepBtn").onclick = () => db.ref(`rooms/${code}/actions/${pid}`).set({t:"-"});
  if ($("voteNowBtn")) $("voteNowBtn").onclick = () => startVote();
  if ($("skipBtn")) $("skipBtn").onclick = () => db.ref(`rooms/${code}/votes/${pid}`).set("skip");
  $("chatBtn").onclick = () => toggleDrawer("chatDr");
  $("noteBtn").onclick = () => toggleDrawer("noteDr");
}

function onPick(id){
  if (!R || !canPick(id)) return;
  const ph = R.state.phase;
  if (ph === "night") db.ref(`rooms/${code}/actions/${pid}`).set({t:id});
  else if (ph === "vote") db.ref(`rooms/${code}/votes/${pid}`).set(id);
}

function showRole(){
  const sr = shownRole(), r = ROLES[sr], real = ROLES[roleOf(pid)];
  let extra = "";
  if (isHainTeam(roleOf(pid))) {
    const mates = Object.keys(R.players).filter(id => id !== pid && isHainTeam(roleOf(id))).map(id => `${R.players[id].name} (${ROLES[roleOf(id)].n})`);
    extra = `<p><b>Takımın:</b> ${mates.length ? esc(mates.join(", ")) : "tek başınasın"}</p>`;
  }
  $("modal").innerHTML = `<div class="card"><p class="big">${r.e}</p><h2 style="margin:4px 0">${r.n}</h2>
    <span class="team ${r.team}">${TEAMS[r.team]}</span><p>${esc(r.d)}</p>${extra}<button class="btn" id="mClose">Tamam</button></div>`;
  $("modal").classList.remove("hidden");
  $("mClose").onclick = () => $("modal").classList.add("hidden");
}

let bannerT;
function banner(html, ms){
  const b = $("banner"); b.innerHTML = html; b.classList.add("on");
  clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove("on"), ms);
}
function renderBanner(){
  const st = R.state, key = st.phase + ":" + st.day + ":" + (st.endsAt || 0);
  if (key === lastBannerKey) return; lastBannerKey = key;
  if (st.phase === "night") {
    banner(`🌙 ${st.day}. gece`, 2200);
    if (st.day === 1) setTimeout(() => { if (R && R.state.phase === "night" && R.players[pid] && mySec()) showRole(); }, 2400);
  }
  else if (st.phase === "dawn" || st.phase === "vres") banner(esc(st.msg || "").replace(/\n/g, "<br>"), 4800);
  else if (st.phase === "day") banner("Tartışma başladı!", 2200);
  else if (st.phase === "vote") banner("Oylama başladı!", 2000);
}

function renderOver(){
  const st = R.state;
  if (st.phase !== "over") return;
  const w = {masum:"Masumlar kazandı! 🎉", hain:"Hainler kazandı! 🔪", seri:"Seri Katil kazandı! 🗡️"}[st.winner] || "Oyun bitti";
  const rows = orderIds().map(id => { const p = R.players[id], r = ROLES[roleOf(id)]; return `<div>${r.e} <b>${esc(p.name)}</b> – ${r.n}${p.alive ? "" : " ☠"}</div>`; }).join("");
  $("modal").innerHTML = `<div class="card"><h2 style="margin:0 0 6px">${w}</h2><div class="final">${rows}</div>` +
    (isHost() ? `<button class="btn" id="againBtn">Lobiye dön</button>` : `<p class="hint">Oda sahibi lobiye dönmeyi seçecek…</p>`) +
    `<button class="btn grey" id="quitBtn">Çık</button></div>`;
  $("modal").classList.remove("hidden");
  if ($("againBtn")) $("againBtn").onclick = backToLobby;
  $("quitBtn").onclick = () => { $("modal").classList.add("hidden"); leave(); };
}

/* ---------- Çekmeceler ---------- */
function closeDrawers(){ document.querySelectorAll(".drawer").forEach(d => d.classList.remove("on")); }
function toggleDrawer(id){ const d = $(id), on = !d.classList.contains("on"); closeDrawers(); d.classList.toggle("on", on); if (on && id === "chatDr") setTimeout(() => $("chatIn").focus(), 280); renderDrawers(); }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => $(b.dataset.close).classList.remove("on"));

function renderDrawers(){
  if ($("chatDr").classList.contains("on") || true) {
    const m = R.chat || {};
    const keys = Object.keys(m).sort().slice(-60);
    const box = $("msgs"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
    box.innerHTML = keys.map(k => { const c = m[k]; return c.sys ? `<div class="msg sys">${esc(c.x)}</div>` : `<div class="msg" style="--c:${c.c}"><b>${esc(c.n)}:</b> ${esc(c.x)}</div>`; }).join("") || `<div class="msg sys">Henüz mesaj yok.</div>`;
    if (atEnd) box.scrollTop = box.scrollHeight;
  }
  const priv = (R.priv && R.priv[pid]) || {}, log = R.log || {};
  let h = "";
  const pk = Object.keys(priv).sort();
  if (pk.length) h += `<h4 style="margin:0 0 6px">Sana özel</h4>` + pk.map(k => `<div class="note priv">${priv[k].day}. gece: ${esc(priv[k].text)}</div>`).join("");
  const lk = Object.keys(log).sort();
  h += `<h4 style="margin:8px 0 6px">Köy günlüğü</h4>` + (lk.length ? lk.map(k => `<div class="note ${log[k].death ? "death" : ""}">${esc(log[k].text)}</div>`).join("") : `<div class="note">Henüz bir şey olmadı.</div>`);
  $("notes").innerHTML = h;
}

/* ---------- Sohbet ---------- */
function sendChat(){
  const inp = $("chatIn"), x = inp.value.trim(); if (!x || !R) return;
  const me = R.players[pid], ph = R.state.phase;
  if (ph !== "lobby" && !me.alive) return toast("Ölüler yazamaz");
  if (ph === "night") return toast("Gece konuşulmaz");
  inp.value = "";
  db.ref(`rooms/${code}/chat`).push({n: me.name, c: me.color, x, t: now()});
}
$("chatSend").onclick = sendChat;
$("chatIn").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

/* ---------- Sayaç ---------- */
function updateClock(){
  if (!R) return;
  const st = R.state, secs = Math.max(0, Math.ceil(((st.endsAt || 0) - now()) / 1000));
  const ico = {night:"🌙", dawn:"🌅", day:"☀️", vote:"🗳️", vres:"📣", over:"🏁"}[st.phase] || "";
  $("phIco").textContent = ico;
  $("secs").textContent = st.phase === "over" ? "" : secs;
  $("timer").classList.toggle("low", secs <= 5 && st.phase !== "over");
}

/* ===================== OYUN MANTIĞI (oda sahibi çalıştırır) ===================== */
function startGame(){
  const pl = R.players, ids = orderIds(), n = ids.length;
  if (n < 3) return toast("En az 3 oyuncu gerekir (bot ekleyebilirsin)");
  const rc = R.settings.roles || {}; let pool = [];
  ROLE_ORDER.forEach(k => { for (let i = 0; i < (rc[k] || 0); i++) pool.push(k); });
  if (pool.length > n) return toast("Rol sayısı oyuncu sayısından fazla");
  if (!pool.some(r => isHainTeam(r) || r === "seri")) return toast("En az bir Hain veya Seri Katil ekle");
  while (pool.length < n) pool.push("koylu");
  shuffle(pool);
  const base = "rooms/" + code, u = {};
  ids.forEach((id, i) => {
    const r = pool[i], o = {role: r};
    if (r === "deli") o.fake = pick(["polis", "izci", "kamera", "doktor"]);
    if (r === "suclayici") o.uses = 3;
    u[`${base}/secret/${id}`] = o;
    u[`${base}/players/${id}/alive`] = true;
    u[`${base}/players/${id}/rev`] = null;
  });
  ["log", "priv", "chat", "actions", "votes"].forEach(k => u[`${base}/${k}`] = null);
  u[`${base}/state`] = {phase:"night", day:1, endsAt: now() + (R.settings.night || 30) * 1000, msg:""};
  doneKey = ""; botKeyDone = ""; lastBannerKey = "";
  db.ref().update(u);
}

function backToLobby(){
  const base = "rooms/" + code, u = {};
  Object.keys(R.players).forEach(id => { u[`${base}/players/${id}/alive`] = true; u[`${base}/players/${id}/rev`] = null; });
  ["secret", "log", "priv", "chat", "actions", "votes"].forEach(k => u[`${base}/${k}`] = null);
  u[`${base}/state`] = {phase:"lobby", day:0};
  doneKey = ""; botKeyDone = ""; lastBannerKey = "";
  db.ref().update(u);
}

function winner(pl, sec){
  let H = 0, S = 0, O = 0;
  Object.keys(pl).forEach(id => {
    if (!pl[id].alive) return;
    const r = sec[id] ? sec[id].role : "koylu";
    if (isHainTeam(r)) H++; else if (r === "seri") S++; else O++;
  });
  if (H === 0 && S === 0) return "masum";
  if (S === 0 && H >= O) return "hain";
  if (H === 0 && S > 0 && O <= 1) return "seri";
  return null;
}

function allActed(){ return Object.keys(R.players).every(id => !R.players[id].alive || (R.actions && R.actions[id])); }
function allVoted(){ return Object.keys(R.players).every(id => !R.players[id].alive || (R.votes && R.votes[id])); }

function hostTick(){
  if (!R || !isHost()) return;
  const st = R.state, ph = st.phase, t = now();
  if (ph === "lobby" || ph === "over") return;
  botsAct();
  const key = ph + ":" + st.day + ":" + (st.endsAt || 0);
  if (key === doneKey) return;
  const base = "rooms/" + code;
  if (ph === "night") { if (t >= st.endsAt || allActed()) { doneKey = key; resolveNight(); } }
  else if (ph === "dawn") { if (t >= st.endsAt) { doneKey = key; db.ref(base + "/state").set({phase:"day", day:st.day, endsAt: t + (R.settings.disc || 75) * 1000, msg:""}); } }
  else if (ph === "day") { if (t >= st.endsAt) { doneKey = key; startVote(); } }
  else if (ph === "vote") { if (t >= st.endsAt || allVoted()) { doneKey = key; resolveVote(); } }
  else if (ph === "vres") {
    if (t >= st.endsAt) {
      doneKey = key;
      const u = {};
      u[base + "/actions"] = null; u[base + "/votes"] = null;
      u[base + "/state"] = {phase:"night", day: st.day + 1, endsAt: t + (R.settings.night || 30) * 1000, msg:""};
      db.ref().update(u);
    }
  }
}

function startVote(){
  if (!R || R.state.phase !== "day") return;
  const st = R.state, u = {}, base = "rooms/" + code;
  u[base + "/votes"] = null;
  u[base + "/state"] = {phase:"vote", day: st.day, endsAt: now() + (R.settings.vote || 30) * 1000, msg:""};
  db.ref().update(u);
}

function botsAct(){
  const st = R.state, bk = st.phase + st.day;
  if (botKeyDone === bk || (st.phase !== "night" && st.phase !== "vote")) return;
  botKeyDone = bk;
  const phase = st.phase, day = st.day;
  Object.keys(R.players).forEach(id => {
    const p = R.players[id]; if (!p.bot || !p.alive) return;
    setTimeout(() => {
      if (!R || R.state.phase !== phase || R.state.day !== day) return;
      const alive = Object.keys(R.players).filter(x => R.players[x].alive && x !== id);
      if (phase === "night") {
        const r = roleOf(id); let opts = alive;
        if (r === "hain" || r === "temizlikci") opts = alive.filter(x => !isHainTeam(roleOf(x)));
        if (r === "doktor") opts = alive.concat([id]);
        if (!ROLES[r].act || !opts.length) db.ref(`rooms/${code}/actions/${id}`).set({t:"-"});
        else db.ref(`rooms/${code}/actions/${id}`).set({t: pick(opts)});
      } else {
        db.ref(`rooms/${code}/votes/${id}`).set(Math.random() < 0.25 || !alive.length ? "skip" : pick(alive));
      }
    }, 1200 + Math.random() * 5000);
  });
}

function resolveNight(){
  const base = "rooms/" + code, pl = R.players, sec = R.secret || {}, act = R.actions || {}, st = R.state;
  const alive = Object.keys(pl).filter(id => pl[id].alive);
  const nm = id => pl[id].name, rl = id => sec[id] ? sec[id].role : "koylu";
  const tg = id => { const a = act[id]; return a && a.t && a.t !== "-" && pl[a.t] && pl[a.t].alive ? a.t : null; };
  const framed = new Set(), protect = new Set(), cleaned = new Set(), hainT = [], visits = [], uses = {};
  let seriT = null;
  alive.forEach(id => {
    const t = tg(id); if (!t) return;
    const r = rl(id);
    visits.push({from: id, to: t});
    if (r === "suclayici") { if ((sec[id].uses || 0) > 0) { framed.add(t); uses[id] = sec[id].uses - 1; } }
    else if (r === "doktor") protect.add(t);
    else if (r === "hain") hainT.push(t);
    else if (r === "temizlikci") { hainT.push(t); cleaned.add(t); }
    else if (r === "seri") seriT = t;
  });
  const attacks = [];
  if (hainT.length) {
    const cnt = {}; hainT.forEach(t => cnt[t] = (cnt[t] || 0) + 1);
    const mx = Math.max(...Object.values(cnt));
    attacks.push(pick(Object.keys(cnt).filter(k => cnt[k] === mx)));
  }
  if (seriT) attacks.push(seriT);
  const dead = new Set(), saved = new Set();
  attacks.forEach(t => { if (protect.has(t)) saved.add(t); else dead.add(t); });

  const u = {}, key = () => db.ref().push().key, others = id => alive.filter(x => x !== id);
  const priv = (id, text) => { u[`${base}/priv/${id}/${key()}`] = {day: st.day, text}; };
  alive.forEach(id => {
    const t = tg(id); if (!t) return;
    const real = rl(id) !== "deli", r = real ? rl(id) : sec[id].fake;
    if (r === "polis") {
      const hain = real ? (isHainTeam(rl(t)) || framed.has(t)) : Math.random() < 0.5;
      priv(id, `Sorgu: ${nm(t)} ${hain ? "HAİN gibi görünüyor." : "masum görünüyor."}`);
    } else if (r === "izci") {
      if (real) {
        const v = visits.filter(x => x.from === t);
        priv(id, v.length ? `${nm(t)} gece ${nm(v[0].to)} evine gitti.` : `${nm(t)} gece evden çıkmadı.`);
      } else {
        const o = others(t); priv(id, o.length && Math.random() < 0.7 ? `${nm(t)} gece ${nm(pick(o))} evine gitti.` : `${nm(t)} gece evden çıkmadı.`);
      }
    } else if (r === "kamera") {
      const c = real ? visits.filter(x => x.to === t && x.from !== id).length : Math.floor(Math.random() * 3);
      priv(id, `${nm(t)} evine gece ${c} kişi geldi.`);
    } else if (r === "doktor") {
      if (real) { if (saved.has(t)) priv(id, `${nm(t)} saldırıya uğradı ama onu kurtardın!`); }
      else if (Math.random() < 0.4) priv(id, `${nm(t)} saldırıya uğradı ama onu kurtardın!`);
    }
  });
  Object.keys(uses).forEach(id => u[`${base}/secret/${id}/uses`] = uses[id]);

  const pl2 = JSON.parse(JSON.stringify(pl)), lines = [];
  dead.forEach(id => {
    pl2[id].alive = false;
    const hide = cleaned.has(id);
    u[`${base}/players/${id}/alive`] = false;
    u[`${base}/players/${id}/rev`] = hide ? "?" : rl(id);
    const txt = `${nm(id)} gece öldürüldü. ${hide ? "Rolü temizlendi, kimse bilemez." : "Rolü: " + ROLES[rl(id)].n + "."}`;
    lines.push(txt);
    u[`${base}/log/${key()}`] = {day: st.day, text: txt, death: true, t: now()};
  });
  if (!dead.size) {
    const txt = "Gece sakin geçti. Kimse ölmedi.";
    lines.push(txt); u[`${base}/log/${key()}`] = {day: st.day, text: txt, t: now()};
  }
  u[`${base}/actions`] = null; u[`${base}/votes`] = null;
  const w = winner(pl2, sec), msg = lines.join("\n");
  u[`${base}/state`] = w ? {phase:"over", day: st.day, winner: w, msg} : {phase:"dawn", day: st.day, endsAt: now() + 6500, msg};
  db.ref().update(u);
}

function resolveVote(){
  const base = "rooms/" + code, pl = R.players, sec = R.secret || {}, votes = R.votes || {}, st = R.state;
  const tally = {}; let skip = 0;
  Object.keys(pl).forEach(id => {
    if (!pl[id].alive) return;
    const v = votes[id]; if (!v) return;
    if (v === "skip" || !pl[v] || !pl[v].alive) skip++; else tally[v] = (tally[v] || 0) + 1;
  });
  let top = null, mx = 0, tie = false;
  Object.keys(tally).forEach(id => { if (tally[id] > mx) { mx = tally[id]; top = id; tie = false; } else if (tally[id] === mx) tie = true; });
  const u = {}, key = () => db.ref().push().key;
  let txt, pl2 = JSON.parse(JSON.stringify(pl));
  if (top && !tie && mx > skip) {
    const r = sec[top] ? sec[top].role : "koylu";
    pl2[top].alive = false;
    u[`${base}/players/${top}/alive`] = false; u[`${base}/players/${top}/rev`] = r;
    txt = `Köy ${pl[top].name} kişisini sürgün etti (${mx} oy). Rolü: ${ROLES[r].n}.`;
    u[`${base}/log/${key()}`] = {day: st.day, text: txt, death: true, t: now()};
  } else {
    txt = "Köy kimseyi sürgün etmedi.";
    u[`${base}/log/${key()}`] = {day: st.day, text: txt, t: now()};
  }
  const w = winner(pl2, sec);
  u[`${base}/state`] = w ? {phase:"over", day: st.day, winner: w, msg: txt} : {phase:"vres", day: st.day, endsAt: now() + 5500, msg: txt};
  db.ref().update(u);
}

/* ===================== Başlangıç ===================== */
$("nameIn").value = LS.get("gk_name") || "";
$("createBtn").onclick = () => createRoom().catch(e => toast("Hata: " + e.message));
$("joinBtn").onclick = () => joinRoom($("codeIn").value).catch(e => toast("Hata: " + e.message));
$("exit").onclick = () => { if (confirm("Odadan çıkmak istiyor musun?")) { if (R && R.state.phase !== "lobby") leave(); else leaveRoom(); } };
(async () => {
  const c = LS.get("gk_room");
  if (c) {
    try {
      const s = await db.ref("rooms/" + c + "/players/" + pid).once("value");
      if (s.exists()) enter(c); else LS.del("gk_room");
    } catch(e) {}
  }
})();
</script>
